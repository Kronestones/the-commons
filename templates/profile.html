{% extends "base.html" %}
{% block title %}@{{ username }} — The Commons{% endblock %}

{% block content %}
<div class="profile-layout">

  <!-- Banner -->
  <div id="profile-banner-wrap" style="position:relative;margin-bottom:-40px;">
    <div class="profile-banner" id="profile-banner" style="height:160px;background:var(--green-dark);border-radius:12px;overflow:hidden;">
      <img id="banner-img" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
    </div>
    <label id="banner-upload-btn" style="display:none;position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.5);color:white;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;z-index:10;">
      📷 Edit Banner
      <input type="file" accept="image/*" style="display:none" onchange="uploadBanner(this)">
    </label>
  </div>

  <div class="profile-header" id="profile-header" style="position:relative;padding-top:20px;">
    <!-- Avatar -->
    <div style="position:relative;display:inline-block;">
      <div class="profile-avatar" id="profile-avatar" style="width:80px;height:80px;border-radius:50%;background:var(--green-mid);display:flex;align-items:center;justify-content:center;font-size:32px;color:white;border:3px solid white;overflow:hidden;"></div>
      <label id="avatar-upload-btn" style="display:none;position:absolute;bottom:0;right:0;background:var(--green-dark);color:white;width:24px;height:24px;border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:12px;">
        📷
        <input type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
      </label>
    </div>
    <div class="profile-avatar" id="profile-avatar"></div>
    <div class="profile-info" id="profile-info">
      <h1 class="profile-username" id="profile-username"></h1>
      <p class="profile-displayname" id="profile-displayname" style="display:none;"></p>
      <p class="profile-bio" id="profile-bio" style="display:none;"></p>
      <p class="profile-joined" id="profile-joined"></p>
      <div class="profile-stats" id="profile-stats"></div>
    </div>
    <div id="profile-actions"></div>
  </div>

  <div class="profile-composer post-composer" id="profile-composer" style="display:none;">
    <textarea id="compose-text" placeholder="Share something with The Commons..." rows="3" maxlength="10000"></textarea>
    <div class="composer-actions">
      <label class="attach-btn">
        📎 Attach
        <input type="file" id="compose-file" accept="image/*,video/*,audio/*" style="display:none" onchange="previewAttachment(this)">
      </label>
      <button class="btn-primary" onclick="submitPost()">Post</button>
    </div>
    <div id="attachment-preview" style="display:none;margin-top:8px;font-size:13px;color:var(--green-mid);"></div>
    <div id="compose-msg" class="composer-note" style="display:none;"></div>
  </div>

  <div class="profile-posts" id="profile-posts">
    <p class="empty-feed">Loading...</p>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
const PAGE_USERNAME = {{ username | tojson }};

let PROFILE_USER_ID = null;
const currentUsername = localStorage.getItem('username') || '';
const isOwn = currentUsername === PAGE_USERNAME;

function getCookieVal(name) {
  const v = document.cookie.match('(^|;)\s*' + name + '\s*=\s*([^;]+)');
  return v ? v.pop() : '';
}
function getProfileToken() {
  try { return getCookieVal('token') || localStorage.getItem('token') || ''; } catch(e) { return ''; }
}

async function uploadAvatar(input) {
  if (!input.files[0]) return;
  const form = new FormData();
  form.append('media', input.files[0]);
  const res = await fetch('/api/profile/avatar', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + getProfileToken() }, body: form
  });
  const data = await res.json();
  if (data.ok) loadProfile();
  else showMessage(data.error || 'Upload failed', true);
}

async function uploadBanner(input) {
  if (!input.files[0]) return;
  const form = new FormData();
  form.append('media', input.files[0]);
  const res = await fetch('/api/profile/banner', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + getProfileToken() }, body: form
  });
  const data = await res.json();
  if (data.ok) loadProfile();
  else showMessage(data.error || 'Upload failed', true);
}

async function loadProfile() {
  const postsEl = document.getElementById('profile-posts');
  const token = getProfileToken();
  if (!token) {
    postsEl.innerHTML = '<p style="padding:20px;color:#c00;">No token — please sign in again.</p>';
    return;
  }
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    const res = await fetch('/api/users/' + PAGE_USERNAME + '/profile', {
      headers: { 'Authorization': 'Bearer ' + token },
      signal: controller.signal
    });
    if (res.status === 401) {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      window.location.href = '/login';
      return;
    }
    const data = await res.json();
    if (!data.ok) {
      postsEl.innerHTML = '<p style="padding:20px;color:#c00;">' + (data.detail || data.error || 'Error loading profile') + '</p>';
      return;
    }
    const p = data.profile;
    PROFILE_USER_ID = p.id;
    const avatarEl = document.getElementById('profile-avatar');
    if (p.avatar_path) {
      avatarEl.innerHTML = '<img src="' + (p.avatar_path.startsWith('http') ? p.avatar_path : '/media/' + p.avatar_path) + '" style="width:100%;height:100%;object-fit:cover;">';
    } else {
      avatarEl.textContent = p.username[0].toUpperCase();
    }
    if (p.banner_path) {
      const bannerImg = document.getElementById('banner-img');
      bannerImg.src = p.banner_path.startsWith('http') ? p.banner_path : '/media/' + p.banner_path;
      bannerImg.style.display = '';
    }
    if (isOwn) {
      document.getElementById('banner-upload-btn').style.display = '';
      const avatarUpload = document.getElementById('avatar-upload-btn');
      avatarUpload.style.display = 'flex';
    }
    document.getElementById('profile-username').textContent = '@' + p.username;
    if (p.display_name && p.display_name !== p.username) {
      const dn = document.getElementById('profile-displayname');
      dn.textContent = p.display_name;
      dn.style.display = '';
    }
    if (p.bio) {
      const bioEl = document.getElementById('profile-bio');
      bioEl.textContent = p.bio;
      bioEl.style.display = '';
    }
    if (p.connections && (p.connections.twitch_url || p.connections.spotify_url || p.connections.youtube_video_url || p.connections.youtube_channel_url || p.connections.bluesky_url || p.connections.tiktok_url)) {
      const c = p.connections;
      let html = '<div class="profile-connections" style="margin-top:16px;display:flex;flex-direction:column;gap:12px;">';
      if (c.twitch_url) {
        html += '<iframe src="' + c.twitch_url + '" height="280" width="100%" allowfullscreen frameborder="0" scrolling="no"></iframe>';
      }
      if (c.spotify_url) {
        html += '<iframe src="' + c.spotify_url + '" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" style="border-radius:12px;"></iframe>';
      }
      if (c.youtube_video_url) {
        html += '<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;"><iframe src="' + c.youtube_video_url + '" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen frameborder="0"></iframe></div>';
      }

      const SVG_ICONS = {
        youtube: '<svg viewBox="0 0 24 24" width="16" height="16" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
        bluesky: '<svg viewBox="0 0 24 24" width="16" height="16" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M5.202 2.857C7.954 4.922 10.913 9.11 12 11.358c1.087-2.247 4.046-6.436 6.798-8.501C20.783 1.366 24 .213 24 3.883c0 .732-.42 6.156-.667 7.037-.856 3.061-3.978 3.842-6.755 3.37 4.854.826 6.089 3.562 3.422 6.299-5.065 5.196-7.28-1.304-7.847-2.97-.104-.305-.152-.448-.153-.327 0-.121-.05.022-.153.327-.568 1.666-2.782 8.166-7.847 2.97-2.667-2.737-1.432-5.473 3.422-6.3-2.777.473-5.899-.308-6.755-3.369C.42 10.04 0 4.615 0 3.883c0-3.67 3.217-2.517 5.202-1.026"/></svg>',
        tiktok: '<svg viewBox="0 0 24 24" width="16" height="16" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>'
      };

      const iconLinks = [];
      if (c.youtube_channel_url && !c.youtube_video_url) {
        iconLinks.push({ url: c.youtube_channel_url, icon: SVG_ICONS.youtube, label: 'YouTube' });
      }
      if (c.bluesky_url) {
        iconLinks.push({ url: c.bluesky_url, icon: SVG_ICONS.bluesky, label: 'Bluesky' });
      }
      if (c.tiktok_url) {
        iconLinks.push({ url: c.tiktok_url, icon: SVG_ICONS.tiktok, label: 'TikTok' });
      }
      if (iconLinks.length) {
        html += '<div style="display:flex;gap:14px;flex-wrap:wrap;">';
        iconLinks.forEach(function(l) {
          html += '<a href="' + l.url + '" target="_blank" rel="noopener noreferrer" title="' + l.label + '" style="display:inline-flex;color:var(--green-dark, #2e7d52);">' + l.icon.replace('width="16" height="16"', 'width="24" height="24"').replace(/fill="white"/, 'fill="currentColor"') + '</a>';
        });
        html += '</div>';
      }
      html += '</div>';
      const existing = document.getElementById('profile-connections-wrap');
      if (existing) existing.remove();
      const wrap = document.createElement('div');
      wrap.id = 'profile-connections-wrap';
      wrap.innerHTML = html;
      document.getElementById('profile-info').appendChild(wrap);
    }
    document.getElementById('profile-joined').textContent = 'Member since ' + p.joined;
    document.getElementById('profile-stats').innerHTML =
      '<span>' + p.followers + ' followers</span> · ' +
      '<span>' + p.following + ' following</span> · ' +
      '<span>' + p.post_count + ' posts</span>';
    const actionsEl = document.getElementById('profile-actions');
    if (isOwn) {
      document.getElementById('profile-composer').style.display = '';
      actionsEl.innerHTML = '<a href="/profile/edit" class="btn-primary">Edit Profile</a>';
    } else if (token) {
      const isBlocked = p.is_blocked || false;
      actionsEl.innerHTML =
        '<button onclick="toggleFollow()" class="btn-primary" id="follow-btn">' + (p.is_following ? 'Unfollow' : 'Follow') + '</button> ' +
        '<button onclick="toggleBlock()" class="delete-btn" id="block-btn" style="font-size:13px;padding:8px 14px;">' + (isBlocked ? 'Unblock' : 'Block') + '</button> ' +
        '<button onclick="sendMessage()" class="btn-primary" style="font-size:13px;padding:8px 14px;background:var(--green-mid);">Message</button>';
    }
    if (!p.posts || p.posts.length === 0) {
      postsEl.innerHTML = '<p class="empty-feed">No posts yet.</p>';
      return;
    }
    postsEl.innerHTML = p.posts.map(post => `
      <div class="post-card" data-post-id="${post.id}" id="post-${post.id}">
        <div class="post-header">
          <span class="post-author"><a href="/profile/${p.username}" style="color:inherit;text-decoration:none;">@${p.username}</a></span>
          <span class="post-time">${post.published_at ? new Date(post.published_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : ''}</span>
        </div>
        <div class="post-content" id="post-content-${post.id}">${typeof linkify === 'function' ? linkify(post.content) : post.content}</div>
        ${typeof extractMediaEmbeds === 'function' ? extractMediaEmbeds(post.content) : ''}
        ${post.media_path ? (
          post.post_type === 'video'
            ? `<video src="${post.media_path.startsWith('http') ? post.media_path : '/media/' + post.media_path}" controls playsinline style="width:100%;border-radius:8px;margin-top:8px;max-height:500px;background:#000;"></video>`
            : `<img src="${post.media_path.startsWith('http') ? post.media_path : '/media/' + post.media_path}" style="width:100%;border-radius:8px;margin-top:8px;max-height:500px;object-fit:cover;">`
        ) : ''}
        <div class="post-actions">
          <button onclick="vote(${post.id}, 1, this)" class="vote-btn ${post.user_voted ? 'voted' : ''}">${post.user_voted ? '❤️' : '🤍'} <span id="score-${post.id}">${Math.round(post.community_score)}</span></button>
          ${isOwn ? '<button onclick="deletePost(' + post.id + ', this)" class="delete-btn">Delete</button>' : ''}
        </div>
        <div id="comments-${post.id}" style="margin-top:8px;">
          <div id="comment-list-${post.id}" style="margin-bottom:8px;"></div>
          <div style="display:flex;gap:8px;">
            <input id="comment-input-${post.id}" type="text" placeholder="Write a comment..."
              style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:20px;font-size:14px;"
              onkeydown="if(event.key==='Enter'){submitComment(${post.id})}">
            <button onclick="submitComment(${post.id})" class="vote-btn" style="padding:8px 14px;font-size:13px;">Post</button>
          </div>
        </div>
      </div>
    `).join('');

    // Load comments for the freshly-rendered profile posts
    if (typeof autoLoadComments === 'function') {
      setTimeout(autoLoadComments, 100);
    }
  } catch(e) {
    document.getElementById('profile-posts').innerHTML = '<p style="padding:20px;color:#c00;">Error: ' + e.message + '</p>';
  }
}

function previewAttachment(input) {
  const preview = document.getElementById('attachment-preview');
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => { preview.style.display = ''; preview.textContent = '📎 ' + input.files[0].name; };
    reader.readAsDataURL(input.files[0]);
  }
}

async function submitPost() {
  const content = document.getElementById('compose-text').value.trim();
  const msgEl = document.getElementById('compose-msg');
  const fileInput = document.getElementById('compose-file');
  const file = fileInput && fileInput.files[0];
  if (!content && !file) return;
  let post_type = 'text';
  if (file) {
    if (file.type.startsWith('image/')) post_type = 'image';
    else if (file.type.startsWith('video/')) post_type = 'video';
    else if (file.type.startsWith('audio/')) post_type = 'audio';
  }
  const form = new FormData();
  form.append('content', content);
  form.append('post_type', post_type);
  if (file) form.append('media', file);
  const res = await fetch('/api/posts', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + getProfileToken() },
    body: form
  });
  const data = await res.json();
  msgEl.style.display = '';
  if (data.ok) {
    msgEl.style.color = '#2e7d4f';
    msgEl.textContent = data.message || 'Posted!';
    document.getElementById('compose-text').value = '';
    setTimeout(() => loadProfile(), 800);
  } else {
    msgEl.style.color = '#c0392b';
    msgEl.textContent = data.error || 'Something went wrong.';
  }
}

async function toggleFollow() {
  const res = await fetch('/api/users/' + PROFILE_USER_ID + '/follow_by_id', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + getProfileToken() }
  });
  const data = await res.json();
  if (data.ok) {
    loadProfile();
  } else {
    showMessage(data.error || 'Could not follow user.', true);
  }
}

async function toggleBlock() {
  if (!confirm('Are you sure?')) return;
  const res = await fetch('/api/users/' + PROFILE_USER_ID + '/block', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + getProfileToken() }
  });
  const data = await res.json();
  if (data.ok) loadProfile();
}

async function sendMessage() {
  window.location.href = '/messages?to=' + PAGE_USERNAME;
}

async function deletePost(postId, btn) {
  if (!confirm('Delete this post?')) return;
  const res = await fetch('/api/posts/' + postId, {
    method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getProfileToken() }
  });
  const data = await res.json();
  if (data.ok) document.getElementById('post-' + postId).remove();
  else showMessage(data.error || 'Could not delete post.', true);
}

// Load profile after short delay
setTimeout(loadProfile, 500);
</script>
{% endblock %}
