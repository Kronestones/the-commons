{% extends "base.html" %}
{% block title %}Edit Profile — The Commons{% endblock %}

{% block content %}
<div class="auth-container">
  <h1>Edit Profile</h1>

  <div class="auth-form">
    <label>Display Name
      <input type="text" id="display-name" maxlength="100" placeholder="How you want to appear">
    </label>

    <label>Bio <small>(max 300 characters)</small>
      <textarea id="bio" maxlength="300" rows="4" placeholder="Tell The Commons who you are..."></textarea>
    </label>

    <label>Twitch <small>(channel name or link — leave blank to remove)</small>
      <input type="text" id="twitch" placeholder="e.g. yourchannel or https://twitch.tv/yourchannel">
    </label>

    <label>Spotify <small>(track, artist, album, or playlist link — leave blank to remove)</small>
      <input type="text" id="spotify" placeholder="Paste a Spotify share link">
    </label>

    <label>YouTube <small>(video or channel link — leave blank to remove)</small>
      <input type="text" id="youtube" placeholder="Paste a video or channel link">
    </label>

    <label>Bluesky <small>(handle or profile link — leave blank to remove)</small>
      <input type="text" id="bluesky" placeholder="e.g. yourname.bsky.social">
    </label>

    <label>TikTok <small>(username or profile link — leave blank to remove)</small>
      <input type="text" id="tiktok" placeholder="e.g. yourusername or https://tiktok.com/@yourusername">
    </label>

    <label>Now Playing <small>(what game are you playing — max 80 characters, leave blank to remove)</small>
      <input type="text" id="now-playing" maxlength="80" placeholder="e.g. Elden Ring">
    </label>

    <label>Profile Theme <small>(pick a look for your profile — optional)</small></label>
    <div id="theme-picker" style="display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 20px;">
      <div class="theme-swatch" data-key="" title="Default" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:var(--green-mid);"></div>
      <div class="theme-swatch" data-key="bubblegum" title="Bubblegum" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#ff6fb0,#c9a7ff);"></div>
      <div class="theme-swatch" data-key="y2k_chrome" title="Y2K Chrome" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#8fa3b3,#1c1c1e);"></div>
      <div class="theme-swatch" data-key="cyberpunk" title="Cyberpunk" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#ff2fd0,#0d0d0d);"></div>
      <div class="theme-swatch" data-key="forest_witch" title="Forest Witch" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#1e4d2b,#d4af37);"></div>
      <div class="theme-swatch" data-key="sunset_glow" title="Sunset Glow" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#ff8a5c,#c46fd6);"></div>
      <div class="theme-swatch" data-key="barbie_energy" title="Barbie Energy" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#ff1493,#ffd700);"></div>
      <div class="theme-swatch" data-key="pride" title="Pride" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(90deg,#e02020,#ff9500,#ffd400,#2ba84a,#2050e0,#7b2fbe);"></div>
      <div class="theme-swatch" data-key="galaxy" title="Galaxy" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#6a4fd6,#1b1035);"></div>
      <div class="theme-swatch" data-key="mermaid_core" title="Mermaid Core" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#2fd9c4,#0a3d40);"></div>
      <div class="theme-swatch" data-key="retro_arcade" title="Retro Arcade" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#ff5e1a,#1a0033);"></div>
      <div class="theme-swatch" data-key="cottagecore" title="Cottagecore" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#7c9473,#d8c3a5);"></div>

      <div class="theme-swatch" data-key="goth_glam" title="Goth Glam" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#6b0f1a,#0d0d0d);"></div>

      <div class="theme-swatch" data-key="royal_velvet" title="Royal Velvet" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#4b0082,#d4af37);"></div>
      <div class="theme-swatch" data-key="mint_chocolate" title="Mint Chocolate" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#2e8b74,#3b2318);"></div>
      <div class="theme-swatch" data-key="blood_moon" title="Blood Moon" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#8b0000,#0a0a0a);"></div>
      <div class="theme-swatch" data-key="arctic_frost" title="Arctic Frost" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#4fa8d8,#ffffff);"></div>
      <div class="theme-swatch" data-key="peach_fuzz" title="Peach Fuzz" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#ffb59e,#ff8c69);"></div>
      <div class="theme-swatch" data-key="electric_lime" title="Electric Lime" style="width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background:linear-gradient(135deg,#c6ff00,#000000);"></div>
    </div>
    <p id="theme-picker-label" style="margin:-14px 0 20px;font-size:13px;color:var(--muted, #888);">Default</p>

    <label>Profile Font <small>(pick a font for your name and bio — optional)</small></label>
    <div id="font-picker" style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 20px;">
      <button type="button" class="font-swatch" data-key="" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="">Default</button>
      <button type="button" class="font-swatch" data-key="bungee" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="bungee">Bungee</button>
      <button type="button" class="font-swatch" data-key="caveat" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="caveat">Caveat</button>
      <button type="button" class="font-swatch" data-key="press_start" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="press_start">Press Start 2P</button>
      <button type="button" class="font-swatch" data-key="fredoka" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="fredoka">Fredoka</button>
      <button type="button" class="font-swatch" data-key="pacifico" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="pacifico">Pacifico</button>
      <button type="button" class="font-swatch" data-key="permanent_marker" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="permanent_marker">Permanent Marker</button>
      <button type="button" class="font-swatch" data-key="bangers" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="bangers">Bangers</button>
      <button type="button" class="font-swatch" data-key="monoton" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="monoton">Monoton</button>
      <button type="button" class="font-swatch" data-key="righteous" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="righteous">Righteous</button>
      <button type="button" class="font-swatch" data-key="playfair" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="playfair">Playfair Display</button>
      <button type="button" class="font-swatch" data-key="space_mono" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="space_mono">Space Mono</button>

      <button type="button" class="font-swatch" data-key="amatic_sc" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="amatic_sc">Amatic SC</button>
      <button type="button" class="font-swatch" data-key="bebas_neue" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="bebas_neue">Bebas Neue</button>
      <button type="button" class="font-swatch" data-key="rock_salt" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="rock_salt">Rock Salt</button>
      <button type="button" class="font-swatch" data-key="special_elite" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="special_elite">Special Elite</button>
      <button type="button" class="font-swatch" data-key="creepster" style="padding:8px 14px;border-radius:8px;border:2px solid transparent;background:var(--green-light, #eee);cursor:pointer;font-size:15px;" data-font-preview="creepster">Creepster</button>

    <div id="edit-msg" class="form-error" style="display:none;"></div>

    <button class="btn-primary btn-full" onclick="saveProfile()">Save Changes</button>
    <a id="cancel-link" href="/" class="btn-secondary btn-full" style="display:block; text-align:center; margin-top:8px;">Cancel</a>

{% endblock %}

{% block scripts %}
<script>
const token = localStorage.getItem('token') || '';
const username = localStorage.getItem('username') || '';

if (!token) window.location.href = '/login';

let selectedFont = '';
const FONT_FAMILIES = {
  '': null, 'bungee': "'Bungee', cursive", 'caveat': "'Caveat', cursive",
  'press_start': "'Press Start 2P', cursive", 'fredoka': "'Fredoka', sans-serif",
  'pacifico': "'Pacifico', cursive", 'permanent_marker': "'Permanent Marker', cursive",
  'bangers': "'Bangers', cursive", 'monoton': "'Monoton', cursive",
  'righteous': "'Righteous', cursive", 'playfair': "'Playfair Display', serif",
  'space_mono': "'Space Mono', monospace", 'comic_neue': "'Comic Neue', cursive",
  'lobster': "'Lobster', cursive", 'orbitron': "'Orbitron', sans-serif",
  'shadows_light': "'Shadows Into Light', cursive",
  'anton': "'Anton', sans-serif",
  'abril_fatface': "'Abril Fatface', serif",
  'vt323': "'VT323', monospace",
  'amatic_sc': "'Amatic SC', cursive",
  'bebas_neue': "'Bebas Neue', sans-serif",
  'rock_salt': "'Rock Salt', cursive",
  'special_elite': "'Special Elite', cursive",
  'creepster': "'Creepster', cursive"
};
(function loadFontPreviewStylesheet() {
  // Each font gets its OWN <link>, loaded independently — if one has any trouble, it
  // can't affect the others. (A single combined request for all fonts at once risked
  // several previews quietly falling back to the same generic style if any one family
  // in that request didn't come through.) The live profile page already only loads
  // the ONE font someone actually picked — this per-font loading is just for this
  // settings page's previews.
  const fontGoogleParams = [
    'family=Bungee',
    'family=Caveat:wght@700',
    'family=Press+Start+2P',
    'family=Fredoka:wght@600',
    'family=Pacifico',
    'family=Permanent+Marker',
    'family=Bangers',
    'family=Monoton',
    'family=Righteous',
    'family=Playfair+Display:wght@700',
    'family=Space+Mono:wght@700',
    'family=Comic+Neue:wght@700',
    'family=Lobster',
    'family=Orbitron:wght@700',
    'family=Shadows+Into+Light',
    'family=Anton',
    'family=Abril+Fatface',
    'family=VT323',
    'family=Amatic+SC:wght@700',
    'family=Bebas+Neue',
    'family=Rock+Salt',
    'family=Special+Elite',
    'family=Creepster'
  ];
  fontGoogleParams.forEach(function(param) {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?' + param + '&display=swap';
    document.head.appendChild(link);
  });
})();
function selectFont(key) {
  selectedFont = key || '';
  document.querySelectorAll('.font-swatch').forEach(el => {
    const active = el.dataset.key === selectedFont;
    el.style.borderColor = active ? '#333' : 'transparent';
    const family = FONT_FAMILIES[el.dataset.key];
    if (family) el.style.fontFamily = family;
  });
}
document.querySelectorAll('.font-swatch').forEach(el => {
  el.addEventListener('click', () => selectFont(el.dataset.key));
});

let selectedTheme = '';
const THEME_LABELS = {
  '': 'Default', 'bubblegum': 'Bubblegum', 'y2k_chrome': 'Y2K Chrome',
  'cyberpunk': 'Cyberpunk', 'forest_witch': 'Forest Witch',
  'sunset_glow': 'Sunset Glow', 'barbie_energy': 'Barbie Energy', 'pride': 'Pride'
,
  'galaxy': 'Galaxy', 'mermaid_core': 'Mermaid Core', 'retro_arcade': 'Retro Arcade', 'cottagecore': 'Cottagecore', 'vaporwave': 'Vaporwave', 'goth_glam': 'Goth Glam', 'tropical_punch': 'Tropical Punch', 'midnight_gold': 'Midnight Gold', 'jewish_heritage': 'Jewish Heritage', 'lavender_dreams': 'Lavender Dreams',
  'neon_nights': 'Neon Nights', 'desert_rose': 'Desert Rose', 'royal_velvet': 'Royal Velvet', 'mint_chocolate': 'Mint Chocolate', 'blood_moon': 'Blood Moon', 'arctic_frost': 'Arctic Frost', 'peach_fuzz': 'Peach Fuzz', 'electric_lime': 'Electric Lime'
};
function selectTheme(key, skipHighlightOthers) {
  selectedTheme = key || '';
  document.querySelectorAll('.theme-swatch').forEach(el => {
    el.style.borderColor = (el.dataset.key === selectedTheme) ? '#333' : 'transparent';
  });
  const label = document.getElementById('theme-picker-label');
  if (label) label.textContent = THEME_LABELS[selectedTheme] || 'Default';
}
document.querySelectorAll('.theme-swatch').forEach(el => {
  el.addEventListener('click', () => selectTheme(el.dataset.key));
});

// Pre-fill current values
async function loadCurrent() {
  if (!username) return;
  document.getElementById('cancel-link').href = '/profile/' + username;
  const res  = await fetch('/api/users/' + username + '/profile', {
    headers: { 'Authorization': 'Bearer ' + token }
  });
  const data = await res.json();
  if (data.ok) {
    const p = data.profile;
    document.getElementById('display-name').value = p.display_name !== p.username ? p.display_name : '';
    document.getElementById('bio').value           = p.bio || '';
    if (p.connections) {
      document.getElementById('twitch').value  = p.connections.twitch_url ? p.connections.twitch_url : '';
      document.getElementById('spotify').value = p.connections.spotify_url ? p.connections.spotify_url : '';
      document.getElementById('youtube').value = p.connections.youtube_video_url ? p.connections.youtube_video_url : (p.connections.youtube_channel_url ? p.connections.youtube_channel_url : '');
    document.getElementById('bluesky').value = p.connections.bluesky_url ? p.connections.bluesky_url : '';
    document.getElementById('tiktok').value = p.connections.tiktok_url ? p.connections.tiktok_url : '';
    document.getElementById('now-playing').value = p.connections.now_playing ? p.connections.now_playing : '';
    selectTheme(p.theme ? p.theme.key : '', true);
    selectFont(p.font ? p.font.key : '');
    }
  }
}

async function saveProfile() {
  const msgEl = document.getElementById('edit-msg');
  const dn    = document.getElementById('display-name').value.trim();
  const bio   = document.getElementById('bio').value.trim();

  let ok = true;

  if (dn) {
    const f = new FormData();
    f.append('display_name', dn);
    const r = await fetch('/api/profile/display-name', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: f
    });
    const d = await r.json();
    if (!d.ok) { ok = false; msgEl.textContent = d.error; msgEl.style.display = ''; }
  }

  if (ok) {
    const f = new FormData();
    f.append('bio', bio);
    const r = await fetch('/api/profile/bio', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: f
    });
    const d = await r.json();
    if (!d.ok) { ok = false; msgEl.textContent = d.error; msgEl.style.display = ''; }
  }

  const twitch  = document.getElementById('twitch').value.trim();
  const spotify = document.getElementById('spotify').value.trim();
  const youtube = document.getElementById('youtube').value.trim();
  const bluesky = document.getElementById('bluesky').value.trim();
  const tiktok = document.getElementById('tiktok').value.trim();
  const nowPlaying = document.getElementById('now-playing').value.trim();

  if (ok) {
    const f = new FormData();
    f.append('twitch', twitch);
    const r = await fetch('/api/profile/twitch', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: f
    });
    const d = await r.json();
    if (!d.ok) { ok = false; msgEl.textContent = d.error; msgEl.style.display = ''; }
  }

  if (ok) {
    const f = new FormData();
    f.append('now_playing', nowPlaying);
    const r = await fetch('/api/profile/now-playing', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: f
    });
    const d = await r.json();
    if (!d.ok) { ok = false; msgEl.textContent = d.error; msgEl.style.display = ''; }
  }

  if (ok) {
    const f = new FormData();
    f.append('font', selectedFont);
    const r = await fetch('/api/profile/font', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: f
    });
    const d = await r.json();
    if (!d.ok) { ok = false; msgEl.textContent = d.error; msgEl.style.display = ''; }
  }

  if (ok) {
    const f = new FormData();
    f.append('palette', selectedTheme);
    const r = await fetch('/api/profile/theme', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: f
    });
    const d = await r.json();
    if (!d.ok) { ok = false; msgEl.textContent = d.error; msgEl.style.display = ''; }
  }

  if (ok) {
    const f = new FormData();
    f.append('spotify', spotify);
    const r = await fetch('/api/profile/spotify', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: f
    });
    const d = await r.json();
    if (!d.ok) { ok = false; msgEl.textContent = d.error; msgEl.style.display = ''; }
  }

  if (ok) {
    const f = new FormData();
    f.append('youtube', youtube);
    const r = await fetch('/api/profile/youtube', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: f
    });
    const d = await r.json();
    if (!d.ok) { ok = false; msgEl.textContent = d.error; msgEl.style.display = ''; }
  }

  if (ok) {
    const f = new FormData();
    f.append('bluesky', bluesky);
    const r = await fetch('/api/profile/bluesky', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: f
    });
    const d = await r.json();
    if (!d.ok) { ok = false; msgEl.textContent = d.error; msgEl.style.display = ''; }
  }

  if (ok) {
    const f = new FormData();
    f.append('tiktok', tiktok);
    const r = await fetch('/api/profile/tiktok', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: f
    });
    const d = await r.json();
    if (!d.ok) { ok = false; msgEl.textContent = d.error; msgEl.style.display = ''; }
  }

  if (ok) {
    window.location.href = '/profile/' + username;
  }
}

loadCurrent();
</script>
